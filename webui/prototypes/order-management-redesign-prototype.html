    .tabs { display: flex; align-items: center; gap: 5px; padding: 9px 0 3px; overflow-x: auto; }

    .switcher { position: fixed; z-index: 100; left: 50%; bottom: 15px; transform: translateX(-50%); display: flex; align-items: stretch; overflow: hidden; border-radius: 999px; color: white; background: #142c3c; box-shadow: 0 10px 28px rgba(10,31,45,.32); font-size: 11px; }

    .toast { position: fixed; z-index: 120; right: 24px; bottom: 22px; max-width: 360px; padding: 10px 14px; border: 1px solid #b8d9c8; border-radius: 6px; color: #24624b; background: #f1fbf5; box-shadow: 0 8px 26px rgba(22,53,43,.16); font-size: 11px; }

    /* Variant A: frozen wide table */
    .variant-a .wide-table { min-width: 1920px; }
    .variant-a .table-base td { vertical-align: middle; }
    .variant-a th:nth-child(1), .variant-a td:nth-child(1) { position: sticky; left: 0; z-index: 9; width: 38px; min-width: 38px; text-align: center; }
    .variant-a th:nth-child(2), .variant-a td:nth-child(2) { position: sticky; left: 38px; z-index: 9; width: 205px; min-width: 205px; box-shadow: 9px 0 15px -14px rgba(16,45,61,.55); }
    .variant-a td:nth-child(1), .variant-a td:nth-child(2) { background: white; }
    .variant-a tr:hover td:nth-child(1), .variant-a tr:hover td:nth-child(2) { background: #f8fcff; }
    .variant-a .product { grid-template-columns: 72px minmax(0, 1fr); align-items: center; gap: 10px; }
    .variant-a .thumb { width: 72px; height: 72px; }
    .variant-a .thumb:after { inset: auto 6px 6px; font-size: 9px; }
    .variant-a .money,
    .variant-a .recipient,
    .variant-a .procure-cell,
    .variant-a .logistics-cell,
    .variant-a .operations-cell,
    .variant-a .remark-list { align-self: center; }
    .variant-a .recipient > *,
    .variant-a .money > *,
    .variant-a .logistics-cell > * { line-height: 1.5; }
    .group-row th { top: 0; height: 29px; color: #547083; background: #dceef7; font-size: 9px; text-align: center; }
    .column-row th { top: 29px; }

    /* Variant B: operational matrix */
    .variant-b .matrix-table { min-width: 1770px; }
    .variant-b .order-lane { position: sticky; left: 0; z-index: 9; width: 225px; min-width: 225px; box-shadow: 9px 0 15px -14px rgba(16,45,61,.55); background: #fff !important; }
    .variant-b th { top: 0; color: white; background: #31576c; }
    .variant-b th.order-lane { background: #17394d; }
    .variant-b td:nth-child(4), .variant-b th:nth-child(4) { background: #fffaf0; }
    .variant-b td:nth-child(5), .variant-b th:nth-child(5) { background: #f5faff; }
    .variant-b td:nth-child(6), .variant-b th:nth-child(6) { background: #fbf8ff; }
    .variant-b td:nth-child(7), .variant-b th:nth-child(7) { background: #f5fbf7; }
    .variant-b .table-base th:nth-child(n+4) { border-left: 1px solid rgba(255,255,255,.18); }

    /* Variant C: compact row with inline workspace */
    .variant-c .compact-body { max-height: 640px; overflow: auto; }
    .order-block { border-bottom: 1px solid #dfe6eb; background: white; }
    .order-summary { min-height: 76px; padding: 9px 12px; display: grid; grid-template-columns: 28px 205px minmax(300px, 1.7fr) 130px 180px 180px 120px; gap: 10px; align-items: center; }
    .order-summary:hover { background: #f8fcff; }
    .order-toggle { width: 23px; height: 23px; border: 1px solid #cbd7df; border-radius: 4px; background: white; cursor: pointer; }
    .inline-workspace { margin: 0 12px 12px 40px; padding: 10px; display: none; grid-template-columns: 1.1fr .9fr 1.25fr .8fr; gap: 9px; border: 1px solid #dce8ef; border-radius: 6px; background: #f5fafc; }
    .order-block.open .inline-workspace { display: grid; }
    .panel { padding: 10px; border: 1px solid #dce5ea; border-radius: 5px; background: white; }
    .panel h4 { margin: 0 0 8px; color: #365363; font-size: 10px; }
    .panel .btn { margin: 3px 3px 0 0; }
    .summary-meta { color: #6e7f8b; font-size: 10px; }
    .empty-note { padding: 18px; color: #8b98a2; text-align: center; }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 64px minmax(0, 1fr); }
      .brand strong, .brand small, .nav-item span:last-child, .side-note { display: none; }
      .nav-item { justify-content: center; padding: 0; }
      .filters { grid-template-columns: 1fr 1fr; }
      .filter-note { display: none; }
    }
  </style>
</head>

    ];

    const variants = {
      A: { title: "A · 居中平衡冻结宽表", subtitle: "订单、商品和关键业务内容垂直居中，商品图片放大，右侧区域仍可横向滑动。" },
      B: { title: "B · 采购物流分舱矩阵", subtitle: "按业务区域分色分舱，采购人员更容易横向扫视；视觉层级更强。" },
      C: { title: "C · 紧凑列表 + 行内工作区", subtitle: "默认保持短列表，展开后所有操作在行内完成；不跳转但纵向密度较低。" }
    };

    function statusChip(order) {
      return `<span class="chip ${order.statusClass}">${order.status}</span>`;
    }

    function orderInfo(order) {
      return `<div class="store-line"><strong>${order.store}</strong>${statusChip(order)}</div>
        <span class="small">${order.time}</span><span class="small">${order.countdown || "—"}</span>
        <button class="order-link mono" data-action="打开官方订单">${order.orderId}</button>`;
    }

    function productInfo(order) {
      return `<div class="product"><span class="thumb"></span><div><p>${order.product}</p><span class="small">商品 ID：${order.itemId}</span><span class="small">数量 ×1</span></div></div>`;
    }

    function moneyInfo(order) {
      return `<div class="money"><small>销售额</small><strong>¥${order.sale.toFixed(2)}</strong><span class="small">实收 ¥${order.received.toFixed(2)}</span><em>${order.cost == null ? "待核算" : `成本 ¥${order.cost.toFixed(2)}`}</em></div>`;
    }

    function recipientInfo(order) {
      return `<div class="recipient"><strong>${order.buyer}　${order.phone}</strong><span>${order.address}</span><div class="mini-actions"><button data-action="解密地址">解密</button><button data-action="复制地址">复制地址</button><button data-action="申请改址">申请改址</button></div></div>`;
    }

    function purchaseInfo(order) {
      return `<div class="procure-cell"><div class="procure-state">${order.purchase}</div><span class="small">${order.purchaseSub}</span><div class="procure-actions"><button class="btn blue" data-action="下单">下单</button><button class="btn soft" data-action="极速下单">极速下单</button><button class="btn" data-action="补录采购订单">补录采购订单</button></div></div>`;
    }

    function logisticsInfo(order) {
      return `<div class="logistics-cell"><span class="${order.logistics === "暂无物流" ? "empty" : "mono"}">${order.logistics}</span><span class="small">${order.logistics === "暂无物流" ? "等待物流单号" : "运输状态：待收货"}</span><button class="btn soft" data-action="手动发货">手动发货</button></div>`;
    }

    function remarksInfo(order) {
      return `<div class="remark-list">${order.notes.map(note => `<span><b>${note.split("：")[0]}：</b>${note.split("：").slice(1).join("：")}</span>`).join("")}</div>`;
    }

    function operationsInfo(order) {
      return `<div class="operations-cell"><div class="operations-stack"><button class="btn primary" data-action="处理订单">处理</button><button class="btn" data-action="同步采购备注">同步采购备注</button><button class="btn" data-action="查看全局日志">查看日志</button></div></div>`;
    }

    function rangeBar(id) {
      return `<div class="slider-bar"><span>横向定位</span><input id="${id}" type="range" min="0" max="100" value="0"><strong>拖动查看右列</strong></div>`;
    }

    function renderA() {
      return `<section class="variant-a" data-scroll-range="scrollA">
        <div class="table-shell"><div class="scroll-area" id="scrollA">
          <table class="table-base wide-table">
            <thead>
              <tr class="group-row"><th></th><th>订单 / 店铺</th><th>商品</th><th>结算 / 利润</th><th>收件人</th><th colspan="2">采购与履约</th><th>物流</th><th>备注与留言</th><th>操作</th></tr>
              <tr class="column-row"><th>选</th><th>订单</th><th>商品</th><th>金额</th><th>收货信息</th><th>采购</th><th>履约</th><th>物流</th><th>全部备注</th><th>操作</th></tr>
            </thead>
            <tbody>${orders.map(order => `<tr>
              <td><input type="checkbox"></td>
              <td>${orderInfo(order)}</td>
              <td>${productInfo(order)}</td>
              <td>${moneyInfo(order)}</td>
              <td>${recipientInfo(order)}</td>
              <td>${purchaseInfo(order)}</td>
              <td><strong>${order.status === "待发货" ? "等待发货" : "已发货"}</strong><span class="small">${order.purchaseSub}</span></td>
              <td>${logisticsInfo(order)}</td>
              <td>${remarksInfo(order)}</td>
              <td>${operationsInfo(order)}</td>
            </tr>`).join("")}</tbody>
          </table>
        </div>${rangeBar("rangeA")}
        <div class="data-foot"><span>共 777 条 · 第 1 / 16 页</span><div class="pager"><button>上一页</button><button class="active">1</button><button>2</button><button>3</button><button>下一页</button></div></div>
        </div>
      </section>`;
    }

    function renderB() {
      return `<section class="variant-b" data-scroll-range="scrollB">
        <div class="table-shell"><div class="scroll-area" id="scrollB">
          <table class="table-base matrix-table">
            <thead><tr><th class="order-lane">订单 / 店铺</th><th>商品 / 金额</th><th>收货人</th><th>采购</th><th>物流履约</th><th>备注 / 留言</th><th>操作</th></tr></thead>
            <tbody>${orders.map(order => `<tr>
              <td class="order-lane">${orderInfo(order)}</td>
              <td>${productInfo(order)}${moneyInfo(order)}</td>
              <td>${recipientInfo(order)}</td>
              <td>${purchaseInfo(order)}</td>
              <td>${logisticsInfo(order)}</td>
              <td>${remarksInfo(order)}</td>
              <td>${operationsInfo(order)}</td>
            </tr>`).join("")}</tbody>
          </table>
        </div>${rangeBar("rangeB")}
        <div class="data-foot"><span>采购与物流是本版核心操作区</span><div class="pager"><button>上一页</button><button class="active">1</button><button>2</button><button>下一页</button></div></div>
        </div>
      </section>`;
    }

    function renderC() {
      return `<section class="variant-c">
        <div class="table-shell"><div class="compact-body">
          ${orders.map((order, index) => `<article class="order-block ${index === 0 ? "open" : ""}">
            <div class="order-summary">
              <button class="order-toggle" data-inline-toggle>${index === 0 ? "−" : "+"}</button>
              <div>${orderInfo(order)}</div>
              <div>${productInfo(order)}</div>
              <div>${moneyInfo(order)}</div>
              <div class="summary-meta">${order.buyer} ${order.phone}<br>${order.address}</div>
              <div class="summary-meta">${order.purchase}<br>${order.logistics}</div>
              <button class="btn primary" data-action="处理订单">展开处理</button>
            </div>
            <div class="inline-workspace">
              <div class="panel"><h4>采购</h4>${purchaseInfo(order)}</div>
              <div class="panel"><h4>物流与履约</h4>${logisticsInfo(order)}<button class="btn" data-action="补录采购订单">补录采购订单</button></div>
              <div class="panel"><h4>备注与留言</h4>${remarksInfo(order)}<button class="btn" data-action="编辑备注">编辑备注</button></div>
              <div class="panel"><h4>操作</h4>${operationsInfo(order)}</div>
            </div>
          </article>`).join("")}
        </div>
        <div class="data-foot"><span>点击 + 展开或收起单条订单工作区</span><div class="pager"><button>上一页</button><button class="active">1</button><button>2</button><button>下一页</button></div></div>
        </div>
      </section>`;
    }

    const renderers = { A: renderA, B: renderB, C: renderC };

    function currentVariant() {
      const value = new URLSearchParams(location.search).get("variant");
      return Object.hasOwn(variants, value) ? value : "A";
    }

    function wireScroller(section) {
      const range = section.querySelector('input[type="range"]');
      const area = section.querySelector(".scroll-area");
      if (!range || !area) return;
      const sync = () => {
        const max = Math.max(0, area.scrollWidth - area.clientWidth);
        range.max = String(max || 1);
        range.value = String(Math.round(area.scrollLeft));
      };
      range.addEventListener("input", () => { area.scrollLeft = Number(range.value); });
      area.addEventListener("scroll", sync, { passive: true });
      sync();
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = `原型交互：${message}。正式版本会在这里接入真实业务或明确禁用原因。`;
      toast.hidden = false;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { toast.hidden = true; }, 2600);
    }

    function render() {
      const key = currentVariant();
      document.getElementById("variantTitle").textContent = variants[key].title;
      document.getElementById("variantSubtitle").textContent = variants[key].subtitle;
      document.getElementById("switchLabel").innerHTML = `${key} · ${variants[key].title.split(" · ")[1]}<small>← → 或点击两侧切换</small>`;
      const root = document.getElementById("prototypeRoot");
      root.innerHTML = renderers[key]();
      root.querySelectorAll("[data-scroll-range]").forEach(wireScroller);
      root.querySelectorAll("[data-action]").forEach(button => button.addEventListener("click", () => showToast(button.dataset.action)));
      root.querySelectorAll("[data-inline-toggle]").forEach(button => button.addEventListener("click", () => {
        const block = button.closest(".order-block");
        block.classList.toggle("open");
        button.textContent = block.classList.contains("open") ? "−" : "+";
      }));
    }

    function selectVariant(key) {
      const url = new URL(location.href);
      url.searchParams.set("variant", key);
      history.replaceState(null, "", url);
      render();
    }

    function cycle(step) {
      const keys = Object.keys(variants);
      const index = keys.indexOf(currentVariant());
      selectVariant(keys[(index + step + keys.length) % keys.length]);
    }

    document.getElementById("prevVariant").addEventListener("click", () => cycle(-1));
    document.getElementById("nextVariant").addEventListener("click", () => cycle(1));
    document.addEventListener("keydown", event => {
      const target = event.target;
      if (target.matches("input,textarea,select,[contenteditable='true']")) return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
    });
    render();
  </script>
</body>
</html>
